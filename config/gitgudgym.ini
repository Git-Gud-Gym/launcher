; Git Gud Gym configuration. [offsets], [boss] and [general] apply the next time the mod attaches.

[settings]
; Training toggles. The app saves these when you flip them.
player_immortal=1
boss_immortal=1
fall_death=1
; Meters below the last solid ground you stood on that count as a fatal fall.
fall_height=20

[app]
toasts=1
hud=1
sound_death=1
sound_defeat=1
; Used by the app's "Launch game" button. Filled in automatically the first time the app sees the game running.
; game_path=C:\Program Files (x86)\Steam\steamapps\common\ELDEN RING\Game\eldenring.exe

[general]
; How often the mod checks HP, in milliseconds. Lower = catches lethal hits sooner.
poll_interval_ms=2
; Free-text tag written to every stats row, e.g. "Malenia NG+2 bleed build"
session_label=

[boss]
; Only enemies within this many meters of you are considered as the boss.
search_radius=80
; Ignore enemies whose max HP is below this (filters out trash mobs).
min_max_hp=300

[offsets]
; Verified statically against eldenring.exe 2.2.0.0 (game patch 1.12.0).
; Only change these if a game update breaks something; F8 in game dumps what they resolve to.
player=0x1E508
chr_list_begin=0x1F1B8
chr_list_end=0x1F1C0
chr_modules=0x190
module_data=0x0
module_physics=0x68
physics_pos=0x70
data_hp=0x138
data_max_hp=0x13C
data_flags=0x19B
no_dead_bit=0
; Fallback: also set the global debug "player no dead" flag (offset into ChrDbgFlags).
use_dbg_player_no_dead=0
dbg_player_no_dead=0x0
