name: Build

on:
  push:
    branches: [main]
    paths-ignore: ['site/**', '**.md']
  pull_request:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Build
        shell: cmd
        run: build.bat

      - name: Package the app and every game module
        shell: pwsh
        run: |
          ./scripts/package.ps1 -Target app
          foreach ($game in Get-ChildItem src/games -Directory) { ./scripts/package.ps1 -Target $game.Name }

      - uses: actions/upload-artifact@v4
        with:
          name: GitGudGym-${{ github.sha }}
          path: dist/
